[package]
name = "open-dock"
version = "0.1.0"
description = "Lightweight, Windows-native liquid-glass desktop dock and D3D11 wallpaper engine."
authors = ["Oscar"]
license = "MIT"
repository = "https://github.com/Oscar0912351/open-dock"
edition = "2021"
rust-version = "1.95"

[lib]
name = "open_dock_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1.0.154"
sha2 = "0.10"

[features]
default = ["nvidia"]
nvidia = ["dep:nvml-wrapper"]

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.debugging]
inherits = "dev"
debug = true

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 4
strip = true
panic = "abort"

[dependencies]
base64 = "0.23.1"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp", "bmp"] }
log = "0.4.35"
nvml-wrapper = { version = "0.13.0", optional = true }
parking_lot = "0.13.0"
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "json"] }
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
sysinfo = "0.40.4"
tauri = { version = "2.12.6", features = ["tray-icon", "image-png", "protocol-asset", "devtools"] }
tauri-plugin-autostart = "2.7.0"
tauri-plugin-dialog = "2.8.4"
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-log = "2.10.2"
tauri-plugin-notification = "2.8.1"
tauri-plugin-opener = "2.7.3"
tauri-plugin-single-instance = "2.5.5"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt", "time", "sync", "macros"] }
ts-rs = { version = "12.0.1", features = ["serde-compat", "uuid-impl"] }
uuid = { version = "1.29.3", features = ["v4", "serde"] }
window-vibrancy = "0.8.1"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Direct3D_Fxc", "Win32_Graphics_DirectComposition", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_Media_MediaFoundation", "Win32_Security", "Win32_Security_Cryptography", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_LibraryLoader", "Win32_System_Pipes", "Win32_System_Registry", "Win32_System_StationsAndDesktops", "Win32_System_Threading", "Win32_System_WinRT", "Win32_System_Performance", "Win32_System_Power", "Win32_UI_Accessibility", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Media_Control", "Foundation", "Foundation_Collections", "Storage_Streams"] }
windows-core = "0.62"
